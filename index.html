<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рулетка 2027 року ✨</title>
<meta name="description" content="Крутни колесо й дізнайся, що чекає на тебе у 2027 році">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8F0; --ink:#2B2233; --muted:#7A6F80; --accent:#E8578F; --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%,#FFE3EF 0,transparent 40%),
      radial-gradient(circle at 85% 15%,#E7E0FF 0,transparent 38%),
      radial-gradient(circle at 80% 85%,#DDF6EC 0,transparent 40%),
      radial-gradient(circle at 10% 90%,#FFF1CC 0,transparent 40%),
      var(--bg);
    display:flex;flex-direction:column;align-items:center;
    padding:28px 16px 40px;overflow-x:hidden;
  }
  .sparkles{position:fixed;inset:0;pointer-events:none;z-index:0}
  .sparkles span{position:absolute;font-size:14px;opacity:.5;animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.7;transform:scale(1.1)}}

  header,main,footer{position:relative;z-index:1}
  header{text-align:center;margin-bottom:18px}
  h1{font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-.5px}
  h1 .grad{background:linear-gradient(90deg,#E8578F,#9B6BFF,#F5A623);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin-top:6px;font-size:clamp(15px,2.6vw,19px);color:var(--muted);font-weight:700}

  main{display:flex;flex-direction:column;align-items:center;width:100%}
  .wheel-wrap{position:relative;width:min(560px,92vw);aspect-ratio:1}
  .wheel-wrap::before{
    content:"";position:absolute;inset:-14px;border-radius:50%;
    background:conic-gradient(from 0deg,#FFB3CF,#C9B6FF,#A8E6CF,#FFE29A,#FFB3CF);
    filter:blur(1px);opacity:.9;
  }
  .wheel-wrap::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:#fff;box-shadow:0 18px 50px rgba(120,60,110,.18)}
  #wheel{position:absolute;inset:0;width:100%;height:100%;z-index:2;will-change:transform}
  .dots{position:absolute;inset:-10px;z-index:3;pointer-events:none}
  .pointer{
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:5;
    width:46px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));transform-origin:50% 20%;
  }
  .pointer.tick{animation:tick .12s ease-out}
  @keyframes tick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
    width:19%;aspect-ratio:1;border-radius:50%;background:#fff;
    box-shadow:0 0 0 7px #2B2233,0 6px 16px rgba(0,0,0,.25);
    display:grid;place-items:center;font-size:clamp(22px,4.5vw,36px);cursor:pointer;user-select:none;
    transition:transform .2s;
  }
  .hub:hover{transform:translate(-50%,-50%) scale(1.06)}

  .controls{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:14px}
  #spin{
    font-family:inherit;font-weight:900;font-size:22px;letter-spacing:1px;color:#fff;
    background:linear-gradient(135deg,#2B2233,#4A3557);border:none;border-radius:999px;
    padding:16px 46px;cursor:pointer;box-shadow:0 10px 24px rgba(43,34,51,.3);
    transition:transform .15s, box-shadow .15s, opacity .2s;
  }
  #spin:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 28px rgba(43,34,51,.35)}
  #spin:active:not(:disabled){transform:translateY(1px)}
  #spin:disabled{opacity:.55;cursor:default}
  .options{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:700;color:var(--muted);font-size:15px}
  .opt{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .switch{width:42px;height:24px;border-radius:999px;background:#D9D2DE;position:relative;transition:background .2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .opt input{display:none}
  .opt input:checked + .switch{background:var(--accent)}
  .opt input:checked + .switch::after{left:21px}
  .link{background:none;border:none;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;font-weight:800}

  .history{margin-top:26px;width:min(640px,94vw);text-align:center}
  .history h3{font-size:15px;color:var(--muted);font-weight:800;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);animation:pop .3s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  footer{margin-top:30px;color:var(--muted);font-weight:700;text-align:center;font-size:15px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(43,34,51,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.show{display:flex;animation:fade .25s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:var(--card);border-radius:28px;width:min(460px,100%);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:rise .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  .card-head{padding:28px 24px 22px;text-align:center}
  .card-head .emoji{font-size:64px;line-height:1;display:block;animation:bounce 1.2s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .card-head .kicker{margin-top:10px;font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
  .card-head h2{font-size:32px;font-weight:900;margin-top:2px}
  .card-body{padding:22px 26px 8px}
  .block{margin-bottom:16px}
  .block .label{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
  .block p{font-size:18px;line-height:1.45;font-weight:700}
  .block.step{background:#FFF6E5;border-radius:16px;padding:12px 14px}
  .card-actions{display:flex;gap:10px;padding:8px 26px 26px}
  .card-actions button{flex:1;font-family:inherit;font-weight:900;font-size:16px;border-radius:999px;padding:13px;cursor:pointer;border:none;transition:transform .15s}
  .card-actions button:hover{transform:translateY(-1px)}
  .btn-primary{background:#2B2233;color:#fff}
  .btn-ghost{background:#F1ECF4;color:var(--ink)}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

  @media (max-width:480px){
    #spin{font-size:19px;padding:14px 36px}
    .card-head h2{font-size:26px}
    .block p{font-size:16px}
  }
</style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>

<header>
  <h1><span class="grad">Рулетка 2027 року</span> ✨</h1>
  <p>Крутни колесо й дізнайся, що чекає на тебе в новому році</p>
</header>

<main>
  <div class="wheel-wrap">
    <svg class="pointer" id="pointer" viewBox="0 0 46 58" aria-hidden="true">
      <path d="M23 56 L4 14 A20 20 0 1 1 42 14 Z" fill="#2B2233"/>
      <circle cx="23" cy="18" r="7" fill="#fff"/>
    </svg>
    <svg id="wheel" viewBox="-300 -300 600 600" role="img" aria-label="Колесо побажань"></svg>
    <svg class="dots" id="dots" viewBox="-310 -310 620 620" aria-hidden="true"></svg>
    <div class="hub" id="hub" title="Крутнути">🎁</div>
  </div>

  <div class="controls">
    <button id="spin">КРУТНУТИ 🎡</button>
    <div class="options">
      <label class="opt"><input type="checkbox" id="noRepeat"><span class="switch"></span>Без повторів</label>
      <label class="opt"><input type="checkbox" id="sound" checked><span class="switch"></span>Звук</label>
      <button class="link" id="reset">Скинути</button>
    </div>
  </div>

  <section class="history" id="historyBox" hidden>
    <h3>Уже випало</h3>
    <div class="chips" id="chips"></div>
  </section>
</main>

<footer>Крутни колесо, розкажи подругам, що випало 💛</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="card">
    <div class="card-head" id="cardHead">
      <span class="emoji" id="cEmoji">✨</span>
      <div class="kicker">У 2027 тебе чекає</div>
      <h2 id="cTitle">Назва</h2>
    </div>
    <div class="card-body">
      <div class="block"><div class="label">Твоє побажання</div><p id="cWish"></p></div>
      <div class="block step"><div class="label">Твій крок у січні</div><p id="cStep"></p></div>
    </div>
    <div class="card-actions">
      <button class="btn-ghost" id="closeBtn">Закрити</button>
      <button class="btn-primary" id="againBtn">Крутнути ще 🔄</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
const SECTORS = [
  {e:"✈️", t:"Подорожі",   c:"#FFC2B4", w:"У 2027 ти побачиш місце, про яке давно мрієш, і привезеш звідти нову себе.", s:"Склади список із 3 місць мрії й обери одне на цей рік."},
  {e:"💰", t:"Гроші",      c:"#FFE7A3", w:"Гроші приходитимуть легко, а керувати ними тобі буде приємно.", s:"Відкрий накопичувальний рахунок і поклади туди першу суму."},
  {e:"🧘‍♀️", t:"Спокій",   c:"#BFEFDF", w:"Рік тиші всередині: менше тривоги, більше довіри до себе й життя.", s:"Щоранку 5 хвилин побудь у тиші, без телефону."},
  {e:"❤️", t:"Кохання",    c:"#FFB8D9", w:"Цей рік наповнить тебе любов'ю: до себе, до близьких і до життя.", s:"Напиши 10 речей, які ти любиш у собі."},
  {e:"📚", t:"Новий скіл", c:"#BCDDFF", w:"Ти опануєш те, що давно хотіла, і здивуєш себе своїм прогресом.", s:"Знайди курс або перший урок і пройди його цього тижня."},
  {e:"🍀", t:"Удача",      c:"#CDEFB5", w:"Удача буде на твоєму боці: потрібні люди й можливості знаходитимуть тебе самі.", s:"Скажи «так» одній пропозиції, від якої зазвичай відмовляєшся."},
  {e:"🦁", t:"Сміливість", c:"#D8C8FF", w:"2027 — рік, коли ти скажеш «так» тому, що лякає й вабить водночас.", s:"Зроби одну річ, яку давно відкладаєш через страх."},
  {e:"🌴", t:"Відпочинок", c:"#B8F0EC", w:"Ти навчишся відпочивати без почуття провини й відновлюватися по-справжньому.", s:"Заплануй у календарі вільний день тільки для себе."},
  {e:"🚀", t:"Кар'єра",    c:"#FFD0A8", w:"Професійний стрибок: нова роль, гідні гроші й проєкти, які запалюють.", s:"Онови резюме або портфоліо і напиши одній людині, з якою мрієш працювати."},
  {e:"💅", t:"Краса",      c:"#FFC9EC", w:"Ти дивитимешся в дзеркало з ніжністю і сяятимеш зсередини.", s:"Влаштуй собі б'юті-вечір без поспіху."},
  {e:"💪", t:"Здоров'я",   c:"#C6F0CC", w:"Твоє тіло дякуватиме тобі енергією, легкістю й міцним сном.", s:"Обери одну корисну звичку й тримай її 21 день."},
  {e:"🏡", t:"Дім",        c:"#FFE0BD", w:"Твій дім стане місцем сили, затишку й тепла.", s:"Розхлами одну шухляду або полицю й додай щось красиве."},
  {e:"🎨", t:"Творчість",  c:"#E2CCFF", w:"Твоя творчість розквітне, і ти створиш щось, чим пишатимешся.", s:"Виділи 30 хвилин на тиждень для творчості без мети."},
  {e:"👯‍♀️", t:"Подруги",  c:"#FFCBC2", w:"Поруч будуть жінки, які надихають, підтримують і радіють твоїм перемогам.", s:"Напиши подрузі, за якою скучила, і домовтеся про зустріч."},
  {e:"🌠", t:"Мрія",       c:"#C4D4FF", w:"Твоя велика мрія зробить у 2027 перший справжній крок до тебе.", s:"Запиши свою мрію на папері й повісь на видне місце."},
  {e:"😂", t:"Радість",    c:"#FFF0A0", w:"Рік сміху, легкості й маленьких щасливих моментів щодня.", s:"Щовечора записуй одну річ, яка сьогодні тебе потішила."},
  {e:"👨‍👩‍👧", t:"Сім'я", c:"#FFD6E4", w:"Більше тепла, розуміння й спільних моментів із рідними.", s:"Влаштуй сімейний вечір без гаджетів."},
  {e:"💡", t:"Натхнення",  c:"#C2F2F7", w:"Ідеї приходитимуть легко, а натхнення не покидатиме тебе весь рік.", s:"Заведи нотатку для ідей і записуй туди все, що спаде на думку."},
  {e:"🕊️", t:"Свобода",   c:"#DCEBD0", w:"Ти звільнишся від того, що тягне назад, і житимеш за своїми правилами.", s:"Склади список «я більше не…» і викресли одну річ уже цього місяця."},
  {e:"🎁", t:"Сюрприз",    c:"#F3C7FF", w:"На тебе чекає приємна несподіванка, якої ти зовсім не очікуєш!", s:"Подаруй собі маленький сюрприз просто зараз 🎁"}
];

const N = SECTORS.length, SEG = 360/N, R = 290;
const wheel = document.getElementById('wheel');
const dotsSvg = document.getElementById('dots');
const NS = "http://www.w3.org/2000/svg";
const used = new Set();
let rotation = 0, spinning = false;

const rad = d => (d-90)*Math.PI/180; // 0deg = top, clockwise
const pt = (r,d) => [r*Math.cos(rad(d)), r*Math.sin(rad(d))];

function el(name, attrs, parent){const n=document.createElementNS(NS,name);for(const k in attrs)n.setAttribute(k,attrs[k]);parent&&parent.appendChild(n);return n;}

function drawWheel(){
  wheel.innerHTML = "";
  SECTORS.forEach((s,i)=>{
    const a0=i*SEG, a1=(i+1)*SEG, [x0,y0]=pt(R,a0), [x1,y1]=pt(R,a1);
    const g = el('g',{},wheel);
    el('path',{d:`M0 0 L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} Z`, fill: used.has(i)?'#E4E0E7':s.c, stroke:'#fff','stroke-width':3},g);
    const mid=a0+SEG/2;
    // label along radius, reading from rim to centre on the left half to stay upright-ish
    const flip = mid>180;
    const tg = el('g',{transform:`rotate(${mid}) translate(0,${-R*0.62}) rotate(${flip?90:-90})`},g);
    el('text',{x:0,y:-2,'text-anchor':'middle','dominant-baseline':'middle','font-size':26},tg).textContent=s.e;
    const tx = el('text',{x:flip?-52:52,y:2,'text-anchor':flip?'end':'start','dominant-baseline':'middle','font-size':17,'font-weight':900,fill: used.has(i)?'#A69DAD':'#2B2233','font-family':'Nunito, sans-serif'},tg);
    tx.textContent=s.t;
    // move emoji outward, text inward along radius
    tg.firstChild.setAttribute('x', flip?78:-78);
    tx.setAttribute('x', flip?50:-50);
    tx.setAttribute('text-anchor', flip?'end':'start');
  });
  el('circle',{cx:0,cy:0,r:R,fill:'none',stroke:'#fff','stroke-width':6},wheel);
}

function drawDots(){
  dotsSvg.innerHTML="";
  for(let i=0;i<N;i++){const [x,y]=pt(300,i*SEG); el('circle',{cx:x,cy:y,r:6,fill:'#fff',stroke:'#E8578F','stroke-width':2,class:'bulb'},dotsSvg);}
}

function setRot(deg){wheel.style.transform=`rotate(${deg}deg)`;}

// --- sound
let actx=null;
function tickSound(){
  if(!document.getElementById('sound').checked) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.value=900+Math.random()*200;
    g.gain.setValueAtTime(.08,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.06);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.07);
  }catch(e){}
}
function winSound(){
  if(!document.getElementById('sound').checked) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [523,659,784,1047].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;const t=actx.currentTime+i*.09;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.4);});
  }catch(e){}
}

const pointer=document.getElementById('pointer');
function pointerTick(){pointer.classList.remove('tick');void pointer.offsetWidth;pointer.classList.add('tick');tickSound();}

function spin(){
  if(spinning) return;
  const noRep=document.getElementById('noRepeat').checked;
  let pool=[...Array(N).keys()].filter(i=>!noRep||!used.has(i));
  if(pool.length===0){alert('Усі сектори вже випали! Натисни «Скинути», щоб почати знову 💛');return;}
  const idx=pool[Math.floor(Math.random()*pool.length)];
  const center=idx*SEG+SEG/2;
  const jitter=(Math.random()-.5)*SEG*0.7;
  const cur=((rotation%360)+360)%360;
  let delta=((-(center+jitter)-cur)%360+360)%360;
  const turns=5+Math.floor(Math.random()*3);
  const target=rotation+turns*360+delta;
  const start=rotation, dist=target-start, dur=4800+Math.random()*800;
  const t0=performance.now();
  let lastSeg=Math.floor(((-start%360)+360)%360/SEG);
  spinning=true; document.getElementById('spin').disabled=true;
  const ease=t=>1-Math.pow(1-t,4);
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    rotation=start+dist*ease(t); setRot(rotation);
    const seg=Math.floor(((-rotation%360)+360)%360/SEG);
    if(seg!==lastSeg){lastSeg=seg;pointerTick();}
    if(t<1) requestAnimationFrame(frame); else finish(idx);
  }
  requestAnimationFrame(frame);
}

function finish(idx){
  spinning=false; document.getElementById('spin').disabled=false;
  const s=SECTORS[idx];
  const first=!used.has(idx);
  used.add(idx);
  if(document.getElementById('noRepeat').checked) drawWheel();
  if(first) addChip(s);
  showCard(s); winSound(); confetti(s.c);
}

function addChip(s){
  document.getElementById('historyBox').hidden=false;
  const c=document.createElement('span');c.className='chip';c.style.background=s.c;c.textContent=`${s.e} ${s.t}`;
  document.getElementById('chips').appendChild(c);
}

const overlay=document.getElementById('overlay');
function showCard(s){
  document.getElementById('cardHead').style.background=s.c;
  document.getElementById('cEmoji').textContent=s.e;
  document.getElementById('cTitle').textContent=s.t;
  document.getElementById('cWish').textContent=s.w;
  document.getElementById('cStep').textContent=s.s;
  overlay.classList.add('show');
}
function closeCard(){overlay.classList.remove('show');}

// --- confetti
const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
let parts=[];
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',resize);resize();
function confetti(main){
  const cols=[main,'#E8578F','#9B6BFF','#F5A623','#5AD8CC','#FFD84D'];
  for(let i=0;i<160;i++){
    parts.push({x:innerWidth/2,y:innerHeight*0.38,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,g:.35+Math.random()*.2,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],life:0,shape:Math.random()<.3?'c':'r'});
  }
  if(parts.length===160) requestAnimationFrame(drawConfetti);
}
function drawConfetti(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-p.life/160);
    if(p.shape==='c'){ctx.beginPath();ctx.arc(0,0,p.s/2,0,Math.PI*2);ctx.fill();}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    ctx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<160);
  if(parts.length) requestAnimationFrame(drawConfetti); else ctx.clearRect(0,0,innerWidth,innerHeight);
}

// --- sparkles background
(function(){const box=document.getElementById('sparkles');const sy=['✦','✧','⋆','✨'];for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=sy[i%sy.length];s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.color=['#E8578F','#9B6BFF','#F5A623'][i%3];box.appendChild(s);}})();

// --- bulbs blink
let bulbOn=0;setInterval(()=>{const b=dotsSvg.querySelectorAll('.bulb');b.forEach((c,i)=>c.setAttribute('fill',(i+bulbOn)%2?'#fff':'#FFD84D'));bulbOn++;},spinning?120:600);

// --- events
document.getElementById('spin').addEventListener('click',spin);
document.getElementById('hub').addEventListener('click',spin);
document.getElementById('againBtn').addEventListener('click',()=>{closeCard();setTimeout(spin,250);});
document.getElementById('closeBtn').addEventListener('click',closeCard);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeCard();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();if((e.key===' '||e.key==='Enter')&&!overlay.classList.contains('show')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();spin();}});
document.getElementById('noRepeat').addEventListener('change',drawWheel);
document.getElementById('reset').addEventListener('click',()=>{used.clear();document.getElementById('chips').innerHTML='';document.getElementById('historyBox').hidden=true;drawWheel();});

drawWheel(); drawDots(); setRot(0);
</script>
